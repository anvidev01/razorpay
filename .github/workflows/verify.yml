name: verify

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

jobs:
  linux:
    name: Ubuntu — build, test, verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libsimdjson-dev libssl-dev libcurl4-openssl-dev default-jdk
      - name: Build engine
        run: |
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Build independent Java auditor
        run: ./control-plane/build.sh
      - name: Verify every claim
        run: ./verify.sh          # non-zero exit == number of failed checks

  macos:
    name: macOS — build, test, verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install simdjson openssl@3
      - name: Build engine
        run: |
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Build independent Java auditor
        run: ./control-plane/build.sh
      - name: Verify every claim
        run: ./verify.sh

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libsimdjson-dev libssl-dev libcurl4-openssl-dev
      - name: Kernel and intent suites under sanitizers
        run: |
          set -e
          # The library sources only. engine/src/*.cpp also globs the twelve rig_*.cpp
          # tools, each with its own main(), so the glob can never link -- and the old
          # fallback compiled kernel.cpp alone, which cannot resolve translate_local.
          # Both paths failed, so this job had never passed. Same list verify.sh uses.
          LIB="engine/src/kernel.cpp engine/src/parse.cpp engine/src/crypto.cpp engine/src/intent.cpp"
          for t in test_kernel test_intent; do
            g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
                -Iengine/include $LIB "engine/tests/$t.cpp" \
                $(pkg-config --cflags --libs simdjson) -lcrypto -lcurl -o "/tmp/san_$t"
          done
          /tmp/san_test_kernel
          /tmp/san_test_intent fixtures/catalog.json
